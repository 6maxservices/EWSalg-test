repos:
  - repo: local
    hooks:
      - id: ews-staged-guard
        name: EWS staged secret and blocklist guard
        entry: python -m tools.check_staged
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: gitleaks-system
        name: gitleaks staged scan (pinned local binary required)
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false
        stages: [pre-commit]
